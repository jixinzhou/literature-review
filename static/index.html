<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国内外研究现状 · 智能生成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbfbfd;
      --surface: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --border: rgba(0,0,0,0.08);
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
    header { text-align: center; margin-bottom: 56px; }
    h1 { font-size: 2.25rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
    .subtitle { font-size: 1rem; color: var(--text-secondary); }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      margin-bottom: 24px;
    }
    html { scroll-behavior: smooth; }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 16px;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 8px;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
    }
    textarea::placeholder { color: var(--text-secondary); opacity: 0.7; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      color: white;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: #f5f5f7;
      color: var(--text);
      margin-left: 8px;
    }
    .btn-secondary:hover:not(:disabled) { background: #e8e8ed; }
    .btn-sm {
      padding: 8px 14px;
      font-size: 0.875rem;
    }
    .btn-ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-ghost:hover:not(:disabled) {
      background: rgba(0,113,227,0.08);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .topic-badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 0.875rem;
      background: rgba(0,113,227,0.08);
      color: var(--accent);
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .lit-item {
      display: flex;
      gap: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      background: var(--surface);
      transition: border-color 0.2s;
    }
    .lit-item:hover { border-color: rgba(0,0,0,0.12); }
    .lit-item .content { flex: 1; min-width: 0; }
    .lit-item h4 { font-size: 1rem; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
    .lit-meta { font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: 8px; }
    .lit-abstract { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5; }
    .abstract-toggle {
      color: var(--accent);
      cursor: pointer;
      font-size: 0.8125rem;
      margin-left: 4px;
    }
    .abstract-toggle:hover { text-decoration: underline; }
    .lit-item .actions-cell { flex-shrink: 0; }
    .review-output {
      white-space: pre-wrap;
      font-size: 1rem;
      line-height: 1.8;
      padding: 20px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .section-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 16px; }
    .hidden { display: none !important; }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      padding: 12px 16px;
      background: #fff5f5;
      color: #c53030;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 16px;
    }
    .step-indicator { font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: 16px; }
    footer { text-align: center; padding: 32px; font-size: 0.8125rem; color: var(--text-secondary); }

    /* 候选抽屉 */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .drawer-overlay.open { opacity: 1; visibility: visible; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(420px, 100vw);
      height: 100vh;
      background: var(--surface);
      box-shadow: -4px 0 24px rgba(0,0,0,0.1);
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.3s;
      overflow-y: auto;
      padding: 24px;
    }
    .drawer-overlay.open .drawer { transform: translateX(0); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .drawer h3 { font-size: 1.125rem; margin: 0; }
    .drawer-close {
      width: 32px; height: 32px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .drawer-close:hover { background: var(--border); color: var(--text); }
    .drawer .lit-item { margin-bottom: 12px; }
    .drawer .drawer-footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }

    /* 文献确认页：左右分栏，右侧固定工具栏 */
    .step2-layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      min-height: 400px;
    }
    .step2-main { flex: 1; min-width: 0; }
    .step2-toolbar {
      flex-shrink: 0;
      width: 140px;
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 20px;
      border-left: 1px solid var(--border);
    }
    .step2-toolbar .btn {
      width: 100%;
      justify-content: center;
      padding: 12px 16px;
    }
    .step2-toolbar .btn-primary { background: var(--accent); color: white; }
    .step2-toolbar .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .lang-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .lang-row .hint { font-size: 0.8125rem; color: var(--text-secondary); }
    .link-btn {
      background: none; border: none; color: var(--text-secondary);
      font-size: inherit; cursor: pointer; text-decoration: underline;
      padding: 0; font-family: inherit;
    }
    .link-btn:hover { color: var(--accent); }

    @media (max-width: 640px) {
      .step2-layout { flex-direction: column; }
      .step2-toolbar {
        width: 100%;
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 12px 0 0;
        padding-left: 0;
        border-left: none;
        border-top: 1px solid var(--border);
      }
      .step2-toolbar .btn { flex: 1; min-width: 100px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>国内外研究现状</h1>
      <p class="subtitle">智能检索 · 筛选 · 生成</p>
    </header>

    <section id="step1" class="card">
      <p class="step-indicator">步骤 1 / 2 — 输入研究描述</p>
      <label for="desc">描述你的研究主题（一段话即可）</label>
      <textarea id="desc" placeholder="例如：基于群体智能算法的移动机器人路径规划，采用改进蚁群算法在栅格环境中进行避障与最优路径搜索"></textarea>
      <div class="actions">
        <button id="btnSearch" class="btn">开始检索</button>
      </div>
      <div id="err1" class="error-msg hidden"></div>
    </section>

    <section id="step2" class="card hidden">
      <p class="step-indicator">步骤 2 / 2 — 确认文献</p>
      <div class="lang-row" id="langRow">
        <button type="button" id="btnLangToggle" class="btn btn-secondary btn-sm">显示原文</button>
        <span class="hint">默认显示中文译文；撰写综述仍使用英文原文以保证引用一致</span>
      </div>
      <div id="topicBadge" class="topic-badge hidden"></div>
      <div class="step2-layout">
        <div class="step2-main">
          <div class="section-title">入选文献 <span id="litCount">0</span> 篇</div>
          <div id="litList"></div>
        </div>
        <aside class="step2-toolbar">
          <button id="btnAddMore" class="btn btn-primary" title="从候选中添加更多文献">＋ 添加文献</button>
          <button id="btnGenerate" class="btn" title="确认后生成综述">生成综述</button>
          <button id="btnBack" class="btn btn-secondary">返回</button>
        </aside>
      </div>
      <div id="err2" class="error-msg hidden"></div>
    </section>

    <section id="step3" class="card hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px">
        <div class="section-title" style="margin:0">国内外研究现状</div>
        <div class="actions" style="margin:0">
          <button id="btnCopy" class="btn btn-secondary btn-sm">复制</button>
          <button id="btnNew" class="btn btn-sm">重新开始</button>
        </div>
      </div>
      <div id="reviewText" class="review-output"></div>
    </section>
  </div>

  <div id="drawerOverlay" class="drawer-overlay">
    <div class="drawer">
      <div class="drawer-header">
        <h3>候选文献 <span id="candCount">0</span> 篇</h3>
        <button id="btnDrawerClose" class="drawer-close" aria-label="关闭" title="关闭">×</button>
      </div>
      <p class="step-indicator" style="margin-bottom:12px">点击添加可多选，完成后关闭</p>
      <div id="candList"></div>
      <div class="drawer-footer">
        <button id="btnDrawerDone" class="btn">完成</button>
      </div>
    </div>
  </div>

  <footer>
    <div>意图理解 · OpenAlex 检索 · 通义千问生成</div>
    <div style="margin-top:12px">
      <button type="button" id="btnLogout" class="link-btn" style="display:none">退出内测</button>
    </div>
  </footer>

  <script>
    const API = '/api';
    let researchTopic = '';
    let works = [];
    let candidates = [];

    function apiJsonHeaders() {
      return { 'Content-Type': 'application/json' };
    }

    (async function initAuthUi() {
      try {
        const r = await fetch(`${API}/auth/status`, { credentials: 'same-origin' });
        const d = await r.json();
        const btn = document.getElementById('btnLogout');
        if (btn && d.require_beta) btn.style.display = 'inline';
      } catch (_) { /* ignore */ }
    })();

    const ABSTRACT_PREVIEW = 120;
    let showZh = true;

    function shownTitle(w) {
      if (showZh && (w.title_zh || '').trim()) return w.title_zh.trim();
      return (w.title || '(无标题)');
    }
    function shownAbstract(w) {
      if (showZh && (w.abstract_zh || '').trim()) return w.abstract_zh || '';
      return w.abstract || '';
    }
    function formatAbstract(abstract, id) {
      const text = abstract || '';
      if (!text) return escapeHtml('（无摘要）');
      if (text.length <= ABSTRACT_PREVIEW) return escapeHtml(text);
      const short = text.slice(0, ABSTRACT_PREVIEW) + '…';
      return `<span class="abstract-text" data-full="${escapeHtml(text)}" data-id="${id}">${escapeHtml(short)}</span> <a href="#" class="abstract-toggle" data-id="${id}">展开</a>`;
    }

    function show(id) {
      document.querySelectorAll('[id^=step]').forEach(el => el.classList.add('hidden'));
      const step = document.getElementById(id);
      if (step) step.classList.remove('hidden');
    }

    function setError(sel, msg) {
      const el = document.getElementById(sel);
      if (!el) return;
      el.textContent = msg || '';
      el.classList.toggle('hidden', !msg);
    }

    function renderWorks(list, containerId, onRemove, onAdd) {
      const el = document.getElementById(containerId);
      if (!el) return;
      el.innerHTML = list.map((w, i) => {
        const removeBtn = onRemove ? `<button class="btn btn-secondary btn-sm" data-i="${i}" data-action="remove">移除</button>` : '';
        const addBtn = onAdd ? `<button class="btn btn-ghost btn-sm" data-i="${i}" data-action="add">添加</button>` : '';
        const aid = (w.openalex_id || `lit-${i}`).replace(/[^a-z0-9-]/gi, '_');
        const abstractHtml = formatAbstract(shownAbstract(w), aid);
        return `
          <div class="lit-item" data-id="${escapeHtml(w.openalex_id || i)}">
            <div class="content">
              <h4>${escapeHtml(shownTitle(w))}</h4>
              <div class="lit-meta">${w.publication_year || ''} · 被引 ${w.cited_by_count ?? 0}</div>
              <div class="lit-abstract" data-aid="${aid}">${abstractHtml}</div>
            </div>
            ${removeBtn || addBtn ? `<div class="actions-cell">${removeBtn}${addBtn}</div>` : ''}
          </div>
        `;
      }).join('');

      el.querySelectorAll('.abstract-toggle').forEach(a => {
        a.onclick = (e) => {
          e.preventDefault();
          const span = el.querySelector(`.abstract-text[data-id="${a.dataset.id}"]`);
          const block = a.closest('.lit-abstract');
          if (!span || !block) return;
          if (a.textContent === '展开') {
            span.innerHTML = escapeHtml(span.dataset.full || '');
            span.classList.add('expanded');
            a.textContent = '收起';
          } else {
            const full = span.dataset.full || '';
            span.innerHTML = escapeHtml(full.slice(0, ABSTRACT_PREVIEW) + '…');
            span.classList.remove('expanded');
            a.textContent = '展开';
          }
        };
      });

      if (onRemove) {
        el.querySelectorAll('[data-action="remove"]').forEach(btn => {
          btn.onclick = (e) => { e.preventDefault(); onRemove(parseInt(btn.dataset.i, 10)); };
        });
      }
      if (onAdd) {
        el.querySelectorAll('[data-action="add"]').forEach(btn => {
          btn.onclick = (e) => { e.preventDefault(); onAdd(parseInt(btn.dataset.i, 10)); };
        });
      }
    }

    function refreshStep2() {
      document.getElementById('litCount').textContent = works.length;
      renderWorks(works, 'litList', (i) => {
        works.splice(i, 1);
        refreshStep2();
      }, null);
    }

    function getAvailableCandidates() {
      const addedIds = new Set(works.map(w => w.openalex_id));
      return candidates.filter(w => !addedIds.has(w.openalex_id));
    }

    function refreshDrawer() {
      const available = getAvailableCandidates();
      document.getElementById('candCount').textContent = available.length;
      renderWorks(available, 'candList', null, (i) => {
        works.push(available[i]);
        refreshStep2();
        refreshDrawer();
      });
    }

    function openDrawer() {
      refreshDrawer();
      document.getElementById('drawerOverlay').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('open');
    }

    function escapeHtml(s) {
      if (s == null) return '';
      const div = document.createElement('div');
      div.textContent = String(s);
      return div.innerHTML;
    }

    async function search() {
      const desc = document.getElementById('desc').value.trim();
      if (!desc) { setError('err1', '请输入研究描述'); return; }
      setError('err1', '');

      const btn = document.getElementById('btnSearch');
      btn.dataset.text = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const res = await fetch(`${API}/search`, {
          method: 'POST',
          headers: apiJsonHeaders(),
          credentials: 'same-origin',
          body: JSON.stringify({
            description: desc,
            translate_literature: true,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || data.detail || '检索失败');

        researchTopic = data.research_topic || '';
        works = data.works || [];
        candidates = data.candidates || [];

        document.getElementById('topicBadge').textContent = researchTopic;
        document.getElementById('topicBadge').classList.remove('hidden');
        showZh = true;
        const btnLang = document.getElementById('btnLangToggle');
        if (btnLang) btnLang.textContent = '显示原文';
        refreshStep2();
        document.getElementById('btnAddMore').classList.toggle('hidden', candidates.length === 0);
        show('step2');
      } catch (e) {
        setError('err1', e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = btn.dataset.text || '开始检索';
      }
    }

    async function generate() {
      if (works.length === 0) { setError('err2', '请至少保留一篇文献'); return; }
      setError('err2', '');
      const btn = document.getElementById('btnGenerate');
      btn.dataset.text = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const res = await fetch(`${API}/generate`, {
          method: 'POST',
          headers: apiJsonHeaders(),
          credentials: 'same-origin',
          body: JSON.stringify({ research_title: researchTopic, works }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || data.detail || '生成失败');
        document.getElementById('reviewText').textContent = data.review_text || '';
        show('step3');
      } catch (e) {
        setError('err2', e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = btn.dataset.text || '生成综述';
      }
    }

    document.getElementById('btnSearch').addEventListener('click', search);
    document.getElementById('btnGenerate').addEventListener('click', generate);
    document.getElementById('btnAddMore').addEventListener('click', openDrawer);
    document.getElementById('btnBack').addEventListener('click', () => show('step1'));
    document.getElementById('btnLangToggle').addEventListener('click', () => {
      showZh = !showZh;
      const btn = document.getElementById('btnLangToggle');
      if (btn) btn.textContent = showZh ? '显示原文' : '显示中文';
      refreshStep2();
      if (document.getElementById('drawerOverlay').classList.contains('open')) refreshDrawer();
    });

    document.getElementById('btnNew').addEventListener('click', () => {
      works = [];
      candidates = [];
      researchTopic = '';
      document.getElementById('desc').value = '';
      showZh = true;
      const btnLang = document.getElementById('btnLangToggle');
      if (btnLang) btnLang.textContent = '显示原文';
      show('step1');
    });
    document.getElementById('btnCopy').addEventListener('click', () => {
      const text = document.getElementById('reviewText').textContent || '';
      if (!text) return;
      navigator.clipboard?.writeText(text).then(() => {
        const btn = document.getElementById('btnCopy');
        const orig = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      });
    });
    document.getElementById('drawerOverlay').addEventListener('click', (e) => {
      if (e.target.classList.contains('drawer-overlay')) closeDrawer();
    });
    document.getElementById('btnDrawerDone').addEventListener('click', closeDrawer);
    document.getElementById('btnDrawerClose').addEventListener('click', closeDrawer);

    document.getElementById('btnLogout').addEventListener('click', async () => {
      try {
        await fetch(`${API}/auth/logout`, { method: 'POST', credentials: 'same-origin' });
      } catch (_) { /* ignore */ }
      window.location.href = '/';
    });
  </script>
</body>
</html>
